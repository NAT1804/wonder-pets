services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-appdata}
      POSTGRES_USER: ${APP_DB_USER:-appuser}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - pets_shop_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${APP_DB_USER:-appuser} -d ${APP_DB_NAME:-appdata}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER:-appuser}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${APP_DB_NAME:-appdata}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

volumes:
  pets_shop_prod_db_data:
