services:
  postgres:
    image: postgres:16
    profiles:
      - keycloak
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - '${KEYCLOAK_DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pets-shop-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-appdata}
      POSTGRES_USER: ${APP_DB_USER:-appuser}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - '${APP_DB_PORT:-5433}:5432'
    volumes:
      - pets_shop_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    profiles:
      - keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    command: start-dev --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    volumes:
      - ./themes:/opt/keycloak/themes
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
  pets_shop_db_data:
